[package]
name = "openrelay-desktop"
version = "0.1.5"
description = "Open Relay desktop client"
authors = ["magikh0e"]
edition = "2021"
rust-version = "1.77"

# The app logic lives in a library crate so the same code can back a desktop
# binary now and (optionally) mobile targets later. main.rs is a thin shim.
[lib]
name = "openrelay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Self-update: check the signed release manifest on GitHub, prompt, install.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"     # optimize for size — this is a webview shell, not a hot loop
lto = true
strip = true
