# Builds the Open Relay desktop app (Tauri) for macOS, Linux and Windows.
#
# Tauri can't cross-compile, so each installer is produced on its own OS runner.
# The Tauri project lives in desktop/ and builds the web UI from ../frontend.
#
# Trigger:
#   - push a tag matching desktop-v*   (e.g. desktop-v0.1.0)  -> release build
#   - or run manually from the Actions tab (workflow_dispatch)
#
# Output: a DRAFT GitHub Release named "Open Relay Desktop v<version>" with the
# .dmg (macOS, universal), .AppImage/.deb (Linux) and .msi/.exe (Windows).
# Review the draft and hit Publish when you're happy with it.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon; builds a universal binary
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04 # older base = wider AppImage compatibility
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds a universal binary, so it needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install web UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts + latest.json so the updater will trust
          # them. The private key is a repo secret; the key has no passphrase.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: "Open Relay Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false

  # Publishes SHA256SUMS.txt alongside the installers.
  #
  # The updater verifies its own signature before applying an update, but that
  # covers updates, not the first download. Somebody fetching a .dmg or a .msi
  # by hand has nothing to check it against unless we publish one, so this
  # closes that gap.
  #
  # It runs as its own job because the three build runners upload to the same
  # release independently; checksums can only be computed once every one of them
  # has finished.
  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Publish SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # tauri-action derives the tag from desktop/package.json, so read it
          # the same way rather than trusting GITHUB_REF_NAME, which is a branch
          # name when this workflow is started by hand.
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v$version"
          echo "Release: $tag"

          # The release is still a DRAFT at this point. `gh release download`
          # resolves drafts, but the REST endpoint /releases/tags/<tag> returns
          # 404 for them, so do not "simplify" this into a gh api call.
          mkdir -p dist-check && cd dist-check
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"

          # Hash what a person would actually download and run. The .sig files
          # are the updater's signatures and latest.json is its manifest;
          # neither is something you install, and hashing our own output file
          # would be circular.
          rm -f ./*.sig latest.json SHA256SUMS.txt
          if [ -z "$(ls -A)" ]; then
            echo "No installer artifacts found for $tag" >&2
            exit 1
          fi

          sha256sum * > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

          # --clobber so re-running the workflow replaces the file rather than
          # failing on an asset that already exists.
          gh release upload "$tag" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
