# Builds the Open Relay desktop app (Tauri) for macOS, Linux and Windows.
#
# Tauri can't cross-compile, so each installer is produced on its own OS runner.
# The Tauri project lives in desktop/ and builds the web UI from ../frontend.
#
# Trigger:
#   - push a tag matching desktop-v*   (e.g. desktop-v0.1.0)  -> release build
#   - or run manually from the Actions tab (workflow_dispatch)
#
# Output: a DRAFT GitHub Release named "Open Relay Desktop v<version>" with the
# .dmg (macOS, universal), .AppImage/.deb (Linux) and .msi/.exe (Windows).
# Review the draft and hit Publish when you're happy with it.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon; builds a universal binary
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04 # older base = wider AppImage compatibility
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds a universal binary, so it needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install web UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts + latest.json so the updater will trust
          # them. The private key is a repo secret; the key has no passphrase.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: "Open Relay Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false
