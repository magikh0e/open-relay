name: CI

# Build & sanity-check on every push and PR. Deployment is not done from
# GitHub — the VPS uses a git push-to-deploy hook (`git push vps main`), so
# there's no SSH deploy job here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Backend — install deps & byte-compile
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Docker builds
        run: |
          docker build -t chat-backend ./backend
          docker build -t chat-web ./frontend
