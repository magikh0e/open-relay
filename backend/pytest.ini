[pytest]
asyncio_mode = auto
# One loop for the whole session: the SQLAlchemy engine and redis pool are
# module-level singletons, so a per-test loop would close connections still
# bound to the previous one.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
